# Banco PostgreSQL local para desenvolvimento.
# Uso:  docker compose up -d   (lê POSTGRES_* do seu .env)
services:
  database:
    image: "postgres:16-alpine"
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
